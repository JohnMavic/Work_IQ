<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Daily Briefing</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0b0d17;
      color: #e0e0e0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* --- Header --- */
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 20px 32px;
      border-bottom: 1px solid #1e2233;
      flex-wrap: wrap;
      gap: 12px;
    }
    header h1 { font-size: 1.4rem; font-weight: 600; color: #fff; }
    .header-right { display: flex; align-items: center; gap: 16px; }
    .last-scan { font-size: 0.8rem; color: #666; }

    /* --- Buttons --- */
    .btn {
      border: none; border-radius: 6px; cursor: pointer;
      font-size: 0.85rem; font-weight: 500; padding: 8px 16px;
      transition: background 0.2s, opacity 0.2s;
    }
    .btn:hover { opacity: 0.85; }
    .btn-primary { background: #3b82f6; color: #fff; }
    .btn-scan { background: #6366f1; color: #fff; font-size: 0.9rem; padding: 10px 20px; }
    .btn-danger { background: #ef4444; color: #fff; padding: 4px 10px; font-size: 0.75rem; }
    .btn-sm { padding: 4px 10px; font-size: 0.75rem; }
    .btn-ghost { background: transparent; border: 1px solid #333; color: #aaa; }
    .btn-ghost.active { border-color: #3b82f6; color: #3b82f6; }

    /* --- Status Badges --- */
    .badge {
      display: inline-block; padding: 2px 8px; border-radius: 10px;
      font-size: 0.7rem; font-weight: 600; text-transform: uppercase;
    }
    .badge-email { background: #1e3a5f; color: #60a5fa; }
    .badge-teams { background: #3b1f5e; color: #a78bfa; }
    .badge-manual { background: #1f2e1f; color: #86efac; }

    .status-select {
      background: #161929; color: #e0e0e0; border: 1px solid #2a2f45;
      border-radius: 4px; padding: 4px 8px; font-size: 0.8rem; cursor: pointer;
    }
    .status-select:focus { outline: none; border-color: #3b82f6; }

    /* Status colors */
    .status-active { color: #60a5fa; }
    .status-in-progress { color: #fbbf24; }
    .status-done { color: #34d399; }
    .status-paused { color: #9ca3af; }

    /* --- Main Content --- */
    main { flex: 1; padding: 24px 32px; overflow-y: auto; }

    /* --- Filter Bar --- */
    .filter-bar {
      display: flex; align-items: center; gap: 8px;
      margin-bottom: 20px; flex-wrap: wrap;
    }
    .task-count {
      margin-left: auto; font-size: 0.8rem; color: #666;
    }

    /* --- Task List --- */
    .task-list { display: flex; flex-direction: column; gap: 8px; }

    .task-card {
      background: #131627;
      border: 1px solid #1e2233;
      border-radius: 8px;
      padding: 16px 20px;
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 8px 16px;
      align-items: start;
      transition: border-color 0.2s;
    }
    .task-card:hover { border-color: #2a3555; }
    .task-card.done { opacity: 0.5; }
    .task-card.active-panel { border-color: #22c55e; background: #0f1a14; }
    .task-card.active-panel.done { opacity: 1; }
    .task-card.agent-busy { border-color: #22c55e; animation: busyPulse 2s ease-in-out infinite; }

    .task-main { display: flex; flex-direction: column; gap: 6px; }
    .task-title { font-size: 0.95rem; font-weight: 500; color: #fff; }
    .task-meta {
      display: flex; align-items: center; gap: 10px;
      font-size: 0.78rem; color: #666;
    }
    .task-meta a { color: #60a5fa; text-decoration: none; }
    .task-meta a:hover { text-decoration: underline; }
    .task-notes { font-size: 0.8rem; color: #888; font-style: italic; margin-top: 2px; }

    .task-actions {
      display: flex; align-items: center; gap: 8px;
    }

    /* --- Task Interaction Panel (v1.4) --- */
    .task-card { cursor: pointer; }
    .task-card .task-main { cursor: pointer; }
    .task-actions { cursor: default; }

    .task-panel {
      display: none;
      background: #0d1020;
      border-top: 1px solid #1e2233;
      padding: 16px 20px;
      grid-column: 1 / -1;
    }
    .task-panel.visible { display: block; }

    /* Agent conversations (chat-style) */
    .agent-conversation {
      margin-bottom: 12px;
      padding: 10px 14px;
      background: #111827;
      border-radius: 8px;
      border-left: 3px solid #3b82f6;
      position: relative;
    }
    .conv-delete-btn {
      position: absolute;
      top: 4px;
      right: 4px;
      background: none;
      border: none;
      cursor: pointer;
      font-size: 0.75rem;
      opacity: 0.3;
      padding: 2px 4px;
      border-radius: 3px;
      transition: opacity 0.2s;
    }
    .conv-delete-btn:hover {
      opacity: 1;
      background: rgba(239, 68, 68, 0.15);
    }
    .agent-msg-user {
      color: #e2e8f0;
      font-size: 0.85rem;
      margin-bottom: 6px;
    }
    .agent-msg-bot {
      color: #93c5fd;
      font-size: 0.85rem;
      margin-bottom: 4px;
    }
    .agent-msg-status {
      font-size: 0.78rem;
      margin-bottom: 6px;
    }
    .agent-comm {
      margin-left: 16px;
      margin-top: 4px;
      font-size: 0.8rem;
      color: #94a3b8;
      border-left: 2px solid #2a2f45;
      padding-left: 10px;
    }
    .agent-comm a { color: #60a5fa; text-decoration: none; }
    .agent-comm a:hover { text-decoration: underline; }
    .agent-no-results {
      color: #64748b;
      font-size: 0.8rem;
      font-style: italic;
      margin-left: 16px;
      margin-top: 4px;
    }

    /* Log input inside panel */
    .panel-log-form {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 12px;
      padding-top: 12px;
      border-top: 1px solid #1e2233;
    }
    .panel-log-form input {
      flex: 1;
      background: #161929; color: #e0e0e0; border: 1px solid #2a2f45;
      border-radius: 6px; padding: 8px 12px; font-size: 0.85rem;
      font-family: inherit;
    }
    .panel-log-form input:focus { outline: none; border-color: #3b82f6; }

    /* Plan display */
    .log-plan {
      display: none;
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 8px;
      padding: 12px 16px;
      margin-top: 8px;
      font-size: 0.9rem;
    }
    .log-plan.visible { display: block; }
    .log-plan-understanding {
      color: #93c5fd;
      margin-bottom: 8px;
      line-height: 1.4;
    }
    .log-plan-details {
      color: #94a3b8;
      font-size: 0.85rem;
      margin-bottom: 10px;
    }
    .log-plan-details span {
      display: block;
      margin: 2px 0;
    }
    .log-plan-actions {
      display: flex;
      gap: 8px;
    }

    /* Clarification */
    .log-clarification {
      display: none;
      margin-top: 8px;
    }
    .log-clarification.visible { display: flex; align-items: center; gap: 8px; }
    .log-clarification input {
      flex: 1;
      padding: 6px 10px;
      border: 1px solid #334155;
      border-radius: 6px;
      background: #0f172a;
      color: #e2e8f0;
      font-size: 0.9rem;
    }

    /* Details toggle */
    .panel-details-toggle {
      font-size: 0.78rem;
      color: #555;
      cursor: pointer;
      background: none;
      border: none;
      padding: 8px 0 0;
      font-family: inherit;
    }
    .panel-details-toggle:hover { color: #888; }
    .panel-details {
      display: none;
      margin-top: 8px;
      padding-top: 8px;
      border-top: 1px solid #1a1f33;
    }
    .panel-details.visible { display: block; }
    .detail-entry {
      font-size: 0.75rem;
      color: #555;
      margin-bottom: 4px;
    }
    .detail-meta {
      font-size: 0.72rem;
      color: #475569;
      margin-left: 16px;
      margin-top: 2px;
      margin-bottom: 6px;
    }
    .detail-meta span { display: block; }

    /* --- Per-Task Spinner --- */
    .task-spinner {
      display: inline-block;
      width: 14px; height: 14px;
      border: 2px solid #1e2233; border-top-color: #6366f1;
      border-radius: 50%; animation: spin 0.8s linear infinite;
      margin-left: 8px; vertical-align: middle;
    }

    /* --- Empty State --- */
    .empty-state {
      text-align: center; padding: 60px 20px; color: #444;
    }
    .empty-state p { font-size: 1rem; margin-bottom: 8px; }
    .empty-state .hint { font-size: 0.8rem; }

    /* --- Add Task Form --- */
    .add-task-section {
      padding: 20px 32px;
      border-top: 1px solid #1e2233;
      background: #0e1020;
    }
    .add-task-form {
      display: flex; gap: 10px; align-items: flex-end; flex-wrap: wrap;
    }
    .form-group { display: flex; flex-direction: column; gap: 4px; }
    .form-group label { font-size: 0.75rem; color: #666; text-transform: uppercase; letter-spacing: 0.5px; }
    .form-group input, .form-group textarea {
      background: #161929; color: #e0e0e0; border: 1px solid #2a2f45;
      border-radius: 6px; padding: 8px 12px; font-size: 0.85rem;
      font-family: inherit;
    }
    .form-group input:focus, .form-group textarea:focus {
      outline: none; border-color: #3b82f6;
    }
    .form-group.title-group { flex: 2; min-width: 200px; }
    .form-group.notes-group { flex: 1; min-width: 150px; }

    /* --- Server Offline Banner --- */
    .server-offline-banner {
      background: #2a1a0a;
      color: #fbbf24;
      border: 1px solid #92400e;
      border-radius: 8px;
      padding: 20px 32px;
      margin-bottom: 20px;
      line-height: 1.7;
    }
    .server-offline-banner h3 { margin-bottom: 8px; font-size: 1rem; }
    .server-offline-banner code {
      background: #1a1206;
      padding: 2px 8px;
      border-radius: 4px;
      font-family: Consolas, "Courier New", monospace;
      font-size: 0.85rem;
    }
    .server-offline-banner .retry-hint {
      margin-top: 12px;
      font-size: 0.8rem;
      opacity: 0.8;
    }

    /* --- Server Status Dot + Tooltip --- */
    .server-dot-wrapper {
      position: relative;
      display: inline-flex;
      align-items: center;
      cursor: pointer;
    }
    .server-dot {
      display: inline-block;
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: #ef4444;
      margin-right: 6px;
      vertical-align: middle;
      transition: box-shadow 0.2s;
    }
    .server-dot.online { background: #34d399; }
    .server-dot-wrapper:hover .server-dot {
      box-shadow: 0 0 6px 2px currentColor;
    }
    .server-dot-wrapper:hover .server-dot.online { color: #34d399; }
    .server-dot-wrapper:hover .server-dot:not(.online) { color: #ef4444; }

    .server-tooltip {
      display: none;
      position: absolute;
      top: calc(100% + 10px);
      right: 0;
      background: #1a1d2e;
      border: 1px solid #2a2f45;
      border-radius: 8px;
      padding: 12px 16px;
      font-size: 0.78rem;
      color: #ccc;
      max-width: 300px;
      min-width: 240px;
      white-space: nowrap;
      z-index: 50;
      opacity: 0;
      transition: opacity 0.2s;
    }
    .server-dot-wrapper:hover .server-tooltip {
      display: block;
      opacity: 1;
    }
    .server-tooltip::before {
      content: '';
      position: absolute;
      top: -6px;
      right: 16px;
      width: 10px;
      height: 10px;
      background: #1a1d2e;
      border-left: 1px solid #2a2f45;
      border-top: 1px solid #2a2f45;
      transform: rotate(45deg);
    }
    .server-tooltip .tooltip-title {
      font-weight: 600;
      margin-bottom: 8px;
      font-size: 0.82rem;
    }
    .server-tooltip .tooltip-title.online { color: #34d399; }
    .server-tooltip .tooltip-title.offline { color: #ef4444; }
    .server-tooltip table { border-collapse: collapse; width: 100%; }
    .server-tooltip td {
      padding: 2px 0;
      vertical-align: top;
    }
    .server-tooltip td:first-child {
      color: #888;
      padding-right: 12px;
    }
    .server-tooltip td:last-child {
      font-family: Consolas, "Courier New", monospace;
      color: #e0e0e0;
    }
    .server-tooltip .offline-hint {
      color: #fbbf24;
      line-height: 1.6;
    }

    /* --- Loading Overlay --- */
    .loading-overlay {
      display: none; position: fixed; inset: 0;
      background: rgba(11, 13, 23, 0.85);
      justify-content: center; align-items: center;
      flex-direction: column; gap: 16px; z-index: 100;
    }
    .loading-overlay.visible { display: flex; }
    .spinner {
      width: 36px; height: 36px;
      border: 3px solid #1e2233; border-top-color: #6366f1;
      border-radius: 50%; animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes busyPulse {
      0%, 100% { box-shadow: 0 0 6px rgba(34, 197, 94, 0.25); }
      50% { box-shadow: 0 0 16px rgba(34, 197, 94, 0.5); }
    }
    .loading-text { font-size: 0.9rem; color: #aaa; }
    .loading-text.warning { color: #fbbf24; }
    .loading-timer { font-size: 0.8rem; color: #555; margin-top: 8px; }

    /* --- Notification Toast --- */
    .notification {
      position: fixed; top: 20px; right: 20px; z-index: 200;
      display: flex; align-items: center; gap: 12px;
      padding: 12px 16px; border-radius: 8px;
      font-size: 0.85rem; max-width: 420px;
      animation: slideIn 0.3s ease;
    }
    .notification button {
      background: none; border: none; color: inherit; cursor: pointer;
      font-size: 1rem; opacity: 0.7; padding: 0 0 0 8px;
    }
    .notification button:hover { opacity: 1; }
    .notification-success { background: #0f2a1f; color: #34d399; border: 1px solid #166534; }
    .notification-error { background: #2a0f0f; color: #f87171; border: 1px solid #7f1d1d; }
    @keyframes slideIn { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
  </style>
</head>
<body>

  <!-- Header -->
  <header>
    <h1>📋 Daily Briefing</h1>
    <div class="header-right">
      <span class="server-dot-wrapper">
        <span class="server-dot" id="serverDot"></span>
        <div class="server-tooltip" id="serverTooltip"></div>
      </span>
      <span class="last-scan" id="lastScan"></span>
      <button class="btn btn-scan" id="btnScan" onclick="triggerScan()">Scan Emails &amp; Teams</button>
    </div>
  </header>

  <!-- Main Content -->
  <main>
    <!-- Server Offline Banner -->
    <div class="server-offline-banner" id="offlineBanner" style="display: none;">
      <h3>⚠️ Server nicht erreichbar</h3>
      <p>Der Backend-Server läuft nicht. Bitte starte ihn:</p>
      <p><strong>Option 1:</strong> Doppelklick auf <code>START-DAILY-BRIEFING.bat</code></p>
      <p><strong>Option 2:</strong> Terminal öffnen und ausführen:<br>
        <code>cd E:\Work_IQ\Daily_Tasks &amp;&amp; node server.js</code></p>
      <div class="retry-hint">🔄 Verbindung wird automatisch geprüft...</div>
    </div>

    <div class="filter-bar">
      <button class="btn btn-ghost btn-sm active" data-filter="all" onclick="setFilter('all', this)">All</button>
      <button class="btn btn-ghost btn-sm" data-filter="active" onclick="setFilter('active', this)">🔵 Active</button>
      <button class="btn btn-ghost btn-sm" data-filter="in-progress" onclick="setFilter('in-progress', this)">🟡 In Progress</button>
      <button class="btn btn-ghost btn-sm" data-filter="done" onclick="setFilter('done', this)">✅ Done</button>
      <button class="btn btn-ghost btn-sm" data-filter="paused" onclick="setFilter('paused', this)">⏸️ Paused</button>
      <span class="task-count" id="taskCount"></span>
    </div>
    <div class="task-list" id="taskList"></div>
  </main>

  <!-- Add Task Form -->
  <section class="add-task-section">
    <form class="add-task-form" id="addTaskForm" onsubmit="addTask(event)">
      <div class="form-group title-group">
        <label for="taskTitle">New Task</label>
        <input type="text" id="taskTitle" placeholder="What needs to be done?" required>
      </div>
      <div class="form-group notes-group">
        <label for="taskNotes">Notes (optional)</label>
        <input type="text" id="taskNotes" placeholder="Additional details...">
      </div>
      <button type="submit" class="btn btn-primary">Add Task</button>
    </form>
  </section>

  <!-- Loading Overlay -->
  <div class="loading-overlay" id="loadingOverlay">
    <div class="spinner"></div>
    <div class="loading-text" id="loadingText">Scanning...</div>
    <div class="loading-timer" id="loadingTimer"></div>
  </div>

<script>
  // --- State ---
  let tasks = [];
  let currentFilter = 'all';
  let serverOnline = false;
  let reconnectTimer = null;

  // --- Server Health Check ---

  async function checkServerHealth() {
    const controller = new AbortController();
    const timeout = setTimeout(() => controller.abort(), 3000);
    try {
      const res = await fetch('/api/tasks', { signal: controller.signal });
      if (res.ok) {
        setServerStatus(true);
        const data = await res.json();
        tasks = data.tasks || [];
        updateLastScan(data.lastScan);
        renderTasks();
        return true;
      }
      setServerStatus(false);
      return false;
    } catch {
      setServerStatus(false);
      return false;
    } finally {
      clearTimeout(timeout);
    }
  }

  function setServerStatus(online) {
    const wasOffline = !serverOnline;
    serverOnline = online;

    const banner = document.getElementById('offlineBanner');
    const dot = document.getElementById('serverDot');
    const tooltip = document.getElementById('serverTooltip');
    const btnScan = document.getElementById('btnScan');
    const btnAddTask = document.querySelector('#addTaskForm button[type="submit"]');

    banner.style.display = online ? 'none' : 'block';
    dot.className = online ? 'server-dot online' : 'server-dot';

    if (online) {
      tooltip.innerHTML =
        '<div class="tooltip-title online">✅ Server verbunden</div>' +
        '<table>' +
        '<tr><td>Express</td><td>localhost:3000</td></tr>' +
        '<tr><td>AI Engine</td><td>GitHub Copilot SDK</td></tr>' +
        '<tr><td>M365 Daten</td><td>Work IQ → Graph API</td></tr>' +
        '<tr><td>Speicher</td><td>tasks.json (lokal)</td></tr>' +
        '</table>';
    } else {
      tooltip.innerHTML =
        '<div class="tooltip-title offline">❌ Server nicht erreichbar</div>' +
        '<div class="offline-hint">' +
        '→ START-DAILY-BRIEFING.bat doppelklicken<br>' +
        '→ Oder: <code>node server.js</code> im Terminal' +
        '</div>';
    }

    btnScan.disabled = !online;
    btnScan.title = online ? '' : 'Server nicht erreichbar';
    if (btnAddTask) {
      btnAddTask.disabled = !online;
      btnAddTask.title = online ? '' : 'Server nicht erreichbar';
    }

    if (online && reconnectTimer) {
      clearInterval(reconnectTimer);
      reconnectTimer = null;
      if (wasOffline) {
        showNotification('✅ Server verbunden', 'success');
      }
    }

    if (!online && !reconnectTimer) {
      reconnectTimer = setInterval(checkServerHealth, 5000);
    }
  }

  // --- API Calls ---

  async function fetchTasks() {
    try {
      const res = await fetch('/api/tasks');
      const data = await res.json();
      tasks = data.tasks || [];
      updateLastScan(data.lastScan);
      setServerStatus(true);
      renderTasks();

      // Re-open all panels that were open before re-render
      for (const taskId of openPanelTaskIds) {
        const panel = document.getElementById('panel-' + taskId);
        if (panel) panel.classList.add('visible');
        const card = document.getElementById('card-' + taskId);
        if (card) card.classList.add('active-panel');
      }
      // Re-apply busy state
      for (const taskId of busyTaskIds) {
        const card = document.getElementById('card-' + taskId);
        if (card) card.classList.add('agent-busy');
      }
      // Restore pending plan displays
      for (const [taskId, pending] of Object.entries(pendingPlans)) {
        if (openPanelTaskIds.has(taskId)) {
          showPlanUI(taskId, pending.plan, pending.fallback);
        }
      }
    } catch (err) {
      console.error('Failed to fetch tasks:', err);
      setServerStatus(false);
    }
  }

  async function addTask(e) {
    e.preventDefault();
    const title = document.getElementById('taskTitle').value.trim();
    const notes = document.getElementById('taskNotes').value.trim();
    if (!title) return;

    try {
      const res = await fetch('/api/tasks', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ title, notes })
      });
      if (res.ok) {
        document.getElementById('taskTitle').value = '';
        document.getElementById('taskNotes').value = '';
        await fetchTasks();
      }
    } catch (err) {
      console.error('Failed to add task:', err);
    }
  }

  async function updateTask(id, updates) {
    try {
      await fetch(`/api/tasks/${id}`, {
        method: 'PATCH',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(updates)
      });
      await fetchTasks();
    } catch (err) {
      console.error('Failed to update task:', err);
    }
  }

  async function deleteTask(id) {
    if (!confirm('Delete this task?')) return;
    try {
      await fetch(`/api/tasks/${id}`, { method: 'DELETE' });
      await fetchTasks();
    } catch (err) {
      console.error('Failed to delete task:', err);
    }
  }

  async function triggerScan() {
    const btn = document.getElementById('btnScan');
    const overlay = document.getElementById('loadingOverlay');
    const loadingText = document.getElementById('loadingText');
    const loadingTimer = document.getElementById('loadingTimer');

    btn.disabled = true;
    btn.textContent = 'Scanning...';
    overlay.classList.add('visible');
    loadingText.className = 'loading-text';

    const steps = [
      { text: 'Connecting to AI engine...', at: 0 },
      { text: 'Starting Work IQ service...', at: 5 },
      { text: 'Authenticating with Microsoft 365...', at: 10 },
      { text: 'Scanning emails (last 4 days)...', at: 15 },
      { text: 'Scanning Teams messages...', at: 25 },
      { text: 'Analyzing messages for action items...', at: 35 },
      { text: 'Almost done — processing results...', at: 50 },
      { text: 'Still working — large mailbox takes longer...', at: 65 },
      { text: 'Hang tight — finalizing...', at: 80 }
    ];

    let elapsed = 0;
    loadingText.textContent = steps[0].text;
    loadingTimer.textContent = '⏱ 00:00';

    const timerInterval = setInterval(() => {
      elapsed++;
      const mm = String(Math.floor(elapsed / 60)).padStart(2, '0');
      const ss = String(elapsed % 60).padStart(2, '0');
      loadingTimer.textContent = `⏱ ${mm}:${ss}`;

      // Advance step based on elapsed time
      for (let i = steps.length - 1; i >= 0; i--) {
        if (elapsed >= steps[i].at) {
          loadingText.textContent = steps[i].text;
          break;
        }
      }

      // Timeout warning at 90s
      if (elapsed === 90) {
        loadingText.textContent = '⚠️ Der Scan dauert ungewöhnlich lange. Deine Mailbox ist möglicherweise sehr gross. Bitte warte noch einen Moment...';
        loadingText.className = 'loading-text warning';
      }
    }, 1000);

    try {
      const res = await fetch('/api/scan', { method: 'POST' });
      const data = await res.json();
      if (!res.ok) {
        showNotification(friendlyError(data), 'error');
      } else {
        await fetchTasks();
        const msg = data.added > 0 || data.updated > 0
          ? `Scan complete: ${data.added} new task${data.added !== 1 ? 's' : ''} added` +
            (data.updated ? `, ${data.updated} updated` : '') +
            (data.skipped ? `, ${data.skipped} duplicate${data.skipped !== 1 ? 's' : ''} skipped` : '') + '.'
          : 'Scan complete: no new action items found.';
        showNotification(msg, 'success');
      }
    } catch (err) {
      if (err.name === 'TypeError' && err.message.includes('fetch')) {
        showNotification('Cannot reach the server. Is it still running?', 'error');
      } else {
        showNotification('Scan failed: ' + err.message, 'error');
      }
    } finally {
      clearInterval(timerInterval);
      overlay.classList.remove('visible');
      loadingText.className = 'loading-text';
      btn.disabled = !serverOnline;
      btn.textContent = 'Scan Emails & Teams';
    }
  }

  function showNotification(message, type = 'success') {
    const existing = document.querySelector('.notification');
    if (existing) existing.remove();

    const el = document.createElement('div');
    el.className = `notification notification-${type}`;
    el.innerHTML = `<span>${message}</span><button onclick="this.parentElement.remove()">✕</button>`;
    document.body.appendChild(el);

    setTimeout(() => { if (el.parentElement) el.remove(); }, 5000);
  }

  function friendlyError(data) {
    const detail = (data.detail || '').toLowerCase();
    const error = data.error || '';

    if (detail.includes('auth') || detail.includes('token') || detail.includes('401') || detail.includes('unauthorized'))
      return 'Authentication expired — please run "workiq accept-eula" in your terminal and try again.';
    if (detail.includes('econnrefused') || detail.includes('spawn') || detail.includes('not found') || detail.includes('not recognized'))
      return 'Could not start Work IQ. Make sure it is installed globally (npm i -g @microsoft/workiq).';
    if (detail.includes('timeout') || detail.includes('timed out'))
      return 'Scan timed out — your mailbox may be very large. Please try again.';
    if (error === 'No response from AI engine')
      return 'No response from AI engine. Check your GitHub Copilot authentication.';
    if (error === 'AI returned unexpected format')
      return 'The AI returned an unexpected response. Please try scanning again.';

    return data.message || error || 'An unexpected error occurred during the scan.';
  }

  // --- Rendering ---

  function renderTasks() {
    const list = document.getElementById('taskList');
    const countEl = document.getElementById('taskCount');

    // Auto-cleanup: hide done tasks older than 3 days
    const threeDaysAgo = new Date(Date.now() - 3 * 24 * 60 * 60 * 1000).toISOString();
    const visibleTasks = tasks.filter(t =>
      !(t.status === 'done' && t.doneAt && t.doneAt < threeDaysAgo)
    );

    // Update filter badge counts (only visible tasks)
    const counts = { all: visibleTasks.length, active: 0, 'in-progress': 0, done: 0, paused: 0 };
    visibleTasks.forEach(t => { if (counts[t.status] !== undefined) counts[t.status]++; });
    document.querySelectorAll('.filter-bar .btn-ghost').forEach(btn => {
      const f = btn.dataset.filter;
      const labels = { all: 'All', active: '🔵 Active', 'in-progress': '🟡 In Progress', done: '✅ Done', paused: '⏸️ Paused' };
      btn.textContent = counts[f] ? `${labels[f]} (${counts[f]})` : labels[f];
    });

    // Sort: active first, then by date (newest first)
    const statusOrder = { 'active': 0, 'in-progress': 1, 'paused': 2, 'done': 3 };
    const sorted = [...visibleTasks].sort((a, b) => {
      const so = (statusOrder[a.status] ?? 9) - (statusOrder[b.status] ?? 9);
      if (so !== 0) return so;
      return new Date(b.createdAt) - new Date(a.createdAt);
    });

    const filtered = currentFilter === 'all' ? sorted : sorted.filter(t => t.status === currentFilter);
    countEl.textContent = `${filtered.length} of ${visibleTasks.length} tasks`;

    if (filtered.length === 0) {
      list.innerHTML = `
        <div class="empty-state">
          <p>No tasks found</p>
          <div class="hint">${visibleTasks.length === 0 ? 'Add a task below or scan your emails to get started.' : 'Try a different filter.'}</div>
        </div>`;
      return;
    }

    list.innerHTML = filtered.map(task => {
      const sourceBadge = task.source === 'email' ? '<span class="badge badge-email">Email</span>'
        : task.source === 'teams' ? '<span class="badge badge-teams">Teams</span>'
        : '<span class="badge badge-manual">Manual</span>';

      const statusClass = `status-${task.status}`;
      const doneClass = task.status === 'done' ? ' done' : '';

      const fromText = task.from ? `from ${escHtml(task.from)}` : '';
      const dateText = task.date ? formatDate(task.date) : '';
      const separator = fromText && dateText ? ' · ' : '';
      const linkHtml = task.link
        ? `<a href="${escHtml(task.link)}" target="_blank" rel="noopener">Open source ↗</a>`
        : '';
      const notesHtml = task.notes ? `<div class="task-notes">${escHtml(task.notes)}</div>` : '';

      // Split history into conversations vs system events
      const history = task.history || [];
      const conversations = history
        .map((entry, idx) => ({ ...entry, _historyIndex: idx }))
        .filter(e => e.type === 'update');
      const systemEvents = history.filter(e => e.type !== 'update');

      return `
        <div class="task-card${doneClass}" id="card-${task.id}">
          <div class="task-main" onclick="toggleTaskPanel('${task.id}')">
            <div class="task-title">${escHtml(task.title)}</div>
            <div class="task-meta">
              ${sourceBadge}
              <span>${fromText}${separator}${dateText}</span>
              ${linkHtml}
            </div>
            ${notesHtml}
          </div>
          <div class="task-actions" onclick="event.stopPropagation()">
            <select class="status-select ${statusClass}" onchange="updateTask('${task.id}', { status: this.value })">
              <option value="active" ${task.status === 'active' ? 'selected' : ''}>🔵 Active</option>
              <option value="in-progress" ${task.status === 'in-progress' ? 'selected' : ''}>🟡 In Progress</option>
              <option value="done" ${task.status === 'done' ? 'selected' : ''}>✅ Done</option>
              <option value="paused" ${task.status === 'paused' ? 'selected' : ''}>⏸️ Paused</option>
            </select>
            <button class="btn btn-danger" onclick="deleteTask('${task.id}')">✕</button>
          </div>
          <div class="task-panel" id="panel-${task.id}">
            ${renderConversations(conversations, task.id)}
            <div class="panel-log-form">
              <input type="text" placeholder="What did you do? e.g. 'Asked Eors for an update'" onkeydown="if(event.key==='Enter')analyzeLog('${task.id}',this)">
              <button class="btn btn-primary btn-sm" onclick="analyzeLog('${task.id}',this.previousElementSibling)">🔍 Analyze</button>
            </div>
            <div class="log-plan" id="plan-${task.id}"></div>
            <div class="log-clarification" id="clarify-${task.id}">
              <input type="text" placeholder="Your answer..." onkeydown="if(event.key==='Enter')submitClarification('${task.id}',this)">
              <button class="btn btn-primary btn-sm" onclick="submitClarification('${task.id}',this.previousElementSibling)">Send</button>
            </div>
            ${renderDetails(conversations, systemEvents, task.id)}
          </div>
        </div>`;
    }).join('');
  }

  function renderConversations(conversations, taskId) {
    if (conversations.length === 0) return '';
    // Chronological order (oldest first = read like a chat)
    return conversations.map(entry => {
      const ts = formatDate(entry.timestamp);
      let html = `<div class="agent-conversation">`;
      html += `<button class="conv-delete-btn" onclick="event.stopPropagation();deleteHistoryEntry('${taskId}',${entry._historyIndex})" title="Delete this entry">🗑️</button>`;
      html += `<div class="agent-msg-user">📝 <strong>${ts}</strong> — ${escHtml(entry.text)}</div>`;

      if (entry.agentPlan) {
        html += `<div class="agent-msg-bot">🤖 ${escHtml(entry.agentPlan.understanding)}</div>`;
        html += entry.agentPlan.fallback
          ? `<div class="agent-msg-status" style="color:#f59e0b">⚠️ Auto-generated</div>`
          : `<div class="agent-msg-status" style="color:#4ade80">✅ User confirmed</div>`;
      }

      if (entry.communications && entry.communications.length > 0) {
        for (const comm of entry.communications) {
          const commIcon = comm.type === 'teams' ? '💬' : '📧';
          const commLink = comm.link
            ? ` <a href="${escHtml(comm.link)}" target="_blank" rel="noopener">Open ↗</a>`
            : '';
          const commDate = comm.date ? formatDate(comm.date) : '';
          html += `<div class="agent-comm">${commIcon} ${escHtml(comm.from || '')} → ${escHtml(comm.to || '')} (${commDate})${commLink}`;
          if (comm.summary) html += `<br>${escHtml(comm.summary)}`;
          html += `</div>`;
        }
      } else if (entry.agentPlan) {
        html += `<div class="agent-no-results">🔍 No communications found</div>`;
      }

      html += `</div>`;
      return html;
    }).join('');
  }

  function renderDetails(conversations, systemEvents, taskId) {
    let detailsHtml = '';

    for (const conv of conversations) {
      const ts = formatDate(conv.timestamp);
      detailsHtml += `<div class="detail-entry" style="color:#94a3b8;margin-top:8px"><strong>📝 ${ts}</strong></div>`;

      // Step 1: AUFTRAG (from agentPlan)
      if (conv.agentPlan) {
        const p = conv.agentPlan;
        detailsHtml += `<div class="detail-meta">`;
        detailsHtml += `<span style="color:#93c5fd"><strong>1️⃣ Auftrag</strong></span>`;
        detailsHtml += `<span>${escHtml(p.understanding)}</span>`;
        const meta = [];
        if (p.keywords?.length) meta.push(`🔑 ${escHtml(p.keywords.join(', '))}`);
        if (p.timeWindow) meta.push(`📅 ${escHtml(p.timeWindow.from || '?')} → ${escHtml(p.timeWindow.to || 'now')}`);
        if (p.searchTargets) meta.push(`🎯 ${escHtml(p.searchTargets)}`);
        if (meta.length) detailsHtml += `<span>${meta.join(' · ')}</span>`;
        detailsHtml += `</div>`;
      }

      if (conv.agentExecution) {
        const ex = conv.agentExecution;
        detailsHtml += `<div class="detail-meta" style="border-left:2px solid #f59e0b;margin-top:4px">`;

        // Step 2: GESENDET (promptSent = search parameters sent to Work IQ)
        const methodLabel = ex.method === 'workiq-ask' ? 'workiq ask (direkt)' : 'Copilot SDK + MCP';
        detailsHtml += `<span style="color:#fbbf24"><strong>2️⃣ Gesendet an Work IQ</strong> <span style="font-size:0.7rem;color:#888">(${methodLabel})</span></span>`;
        if (ex.promptSent) {
          detailsHtml += `<span>${escHtml(ex.promptSent)}</span>`;
        }

        // Step 3: ANTWORT (rawResponse or error, with duration)
        const duration = ex.durationMs ? ` (${(ex.durationMs / 1000).toFixed(1)}s)` : '';
        if (ex.error) {
          detailsHtml += `<span style="color:#f87171"><strong>3️⃣ Antwort von Work IQ${duration}</strong></span>`;
          detailsHtml += `<span style="color:#f87171">❌ ${escHtml(ex.error)}</span>`;
        } else if (ex.rawResponse) {
          detailsHtml += `<span style="color:#4ade80"><strong>3️⃣ Antwort von Work IQ${duration}</strong></span>`;
          const truncated = ex.rawResponse.length > 800 ? ex.rawResponse.substring(0, 800) + '...' : ex.rawResponse;
          detailsHtml += `<span style="white-space:pre-wrap;font-size:0.7rem;color:#64748b">${escHtml(truncated)}</span>`;
        } else {
          detailsHtml += `<span style="color:#9ca3af"><strong>3️⃣ Antwort von Work IQ${duration}</strong></span>`;
          detailsHtml += `<span style="color:#9ca3af">Keine Antwort erhalten</span>`;
        }

        // Step 4: ERGEBNIS (parsed communications summary)
        detailsHtml += `<span style="color:#93c5fd"><strong>4️⃣ Ergebnis für Benutzer</strong></span>`;
        if (ex.error) {
          detailsHtml += `<span>⚠️ Suche fehlgeschlagen — Eintrag ohne Kommunikationen gespeichert</span>`;
        } else if (conv.communications?.length > 0) {
          detailsHtml += `<span>✅ ${ex.parsedCount} Kommunikation(en) extrahiert:</span>`;
          for (const c of conv.communications) {
            const icon = c.type === 'teams' ? '💬' : '📧';
            // Handle both ISO dates and natural language dates from Markdown parser
            let cDate = '';
            if (c.date) {
              const d = new Date(c.date);
              cDate = isNaN(d.getTime()) ? c.date : formatDate(c.date);
            }
            const recipient = c.to ? ` → ${escHtml(c.to)}` : '';
            detailsHtml += `<span style="margin-left:8px"><strong>${icon} ${escHtml(c.from || '?')}${recipient}</strong> (${escHtml(cDate)})</span>`;
            if (c.summary) {
              detailsHtml += `<span style="margin-left:16px;color:#94a3b8;font-size:0.8rem">${escHtml(c.summary)}</span>`;
            }
            if (c.link) {
              detailsHtml += `<span style="margin-left:16px"><a href="${escHtml(c.link)}" target="_blank" style="color:#60a5fa;font-size:0.75rem">🔗 Öffnen</a></span>`;
            }
          }
        } else if (ex.rawResponse && !ex.error) {
          // Work IQ responded but no structured data parsed — show natural language answer
          detailsHtml += `<span>📝 Work IQ Antwort (kein strukturiertes Ergebnis):</span>`;
          const answer = ex.rawResponse.length > 2000 ? ex.rawResponse.substring(0, 2000) + '...' : ex.rawResponse;
          detailsHtml += `<span style="white-space:pre-wrap;font-size:0.8rem;color:#cbd5e1">${escHtml(answer)}</span>`;
        } else {
          detailsHtml += `<span>🔍 Keine Kommunikationen gefunden</span>`;
        }

        detailsHtml += `</div>`;
      }
    }

    // System events (reverse chronological)
    if (systemEvents.length > 0) {
      detailsHtml += `<div style="margin-top:8px;padding-top:8px;border-top:1px solid #1a1f33">`;
      for (const entry of [...systemEvents].reverse()) {
        const icon = entry.type === 'created' ? '➕' : entry.type === 'status-change' ? '✅' : entry.type === 'scan-update' ? '🔄' : '📌';
        detailsHtml += `<div class="detail-entry"><span style="color:#444">${formatDate(entry.timestamp)}</span> ${icon} ${escHtml(entry.text)}</div>`;
      }
      detailsHtml += `</div>`;
    }

    if (!detailsHtml) return '';

    return `
      <button class="panel-details-toggle" onclick="event.stopPropagation();toggleDetails('${taskId}')">▶ Details</button>
      <div class="panel-details" id="details-${taskId}">${detailsHtml}</div>`;
  }

  function toggleTaskPanel(taskId) {
    const panel = document.getElementById('panel-' + taskId);
    if (!panel) return;
    const card = document.getElementById('card-' + taskId);
    const isVisible = panel.classList.contains('visible');

    if (!isVisible) {
      panel.classList.add('visible');
      openPanelTaskIds.add(taskId);
      if (card) card.classList.add('active-panel');
      const input = panel.querySelector('.panel-log-form input');
      if (input) setTimeout(() => input.focus(), 100);
    } else {
      panel.classList.remove('visible');
      openPanelTaskIds.delete(taskId);
      if (card) card.classList.remove('active-panel');
    }
  }

  function toggleDetails(taskId) {
    const el = document.getElementById('details-' + taskId);
    const btn = el?.previousElementSibling;
    if (el) {
      el.classList.toggle('visible');
      if (btn) btn.textContent = el.classList.contains('visible') ? '▼ Details' : '▶ Details';
    }
  }

  // --- Log Work: Two-Phase Agent (v1.4) ---

  let pendingPlans = {}; // taskId → { plan, originalText, fallback }
  let openPanelTaskIds = new Set(); // Multiple panels can be open simultaneously
  let busyTaskIds = new Set(); // Tasks with active agent work (analyzing or executing)

  async function analyzeLog(taskId, input) {
    const text = input.value.trim();
    if (!text) return;

    let planEl = document.getElementById('plan-' + taskId);
    let clarifyEl = document.getElementById('clarify-' + taskId);
    input.disabled = true;

    // Mark task as busy (neon green highlight)
    busyTaskIds.add(taskId);
    document.getElementById('card-' + taskId)?.classList.add('agent-busy');

    planEl.innerHTML = '<div class="log-plan-understanding">🤔 Agent is analyzing your request...</div>';
    planEl.classList.add('visible');
    clarifyEl.classList.remove('visible');

    try {
      const res = await fetch(`/api/tasks/${taskId}/log/analyze`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ text })
      });
      const data = await res.json();

      // Re-acquire DOM refs (may have been rebuilt by another task's fetchTasks)
      planEl = document.getElementById('plan-' + taskId);
      clarifyEl = document.getElementById('clarify-' + taskId);
      if (!planEl) return;

      if (!res.ok) {
        showNotification(friendlyError(data), 'error');
        planEl.classList.remove('visible');
        return;
      }

      const plan = data.plan;
      pendingPlans[taskId] = { plan, originalText: text, fallback: !!data.fallback };

      if (plan.needsClarification && plan.clarificationQuestion) {
        planEl.innerHTML = `<div class="log-plan-understanding">❓ ${plan.clarificationQuestion}</div>`;
        planEl.classList.add('visible');
        if (clarifyEl) {
          clarifyEl.classList.add('visible');
          clarifyEl.querySelector('input')?.focus();
        }
      } else {
        showPlanUI(taskId, plan, !!data.fallback);
      }
    } catch (err) {
      showNotification('Analysis failed: ' + err.message, 'error');
      const el = document.getElementById('plan-' + taskId);
      if (el) el.classList.remove('visible');
    } finally {
      const freshInput = document.querySelector(`#panel-${taskId} .panel-log-form input`);
      if (freshInput) freshInput.disabled = false;
      busyTaskIds.delete(taskId);
      document.getElementById('card-' + taskId)?.classList.remove('agent-busy');
    }
  }

  async function submitClarification(taskId, input) {
    const answer = input.value.trim();
    if (!answer) return;

    const pending = pendingPlans[taskId];
    if (!pending) return;

    // Re-analyze with additional context
    const logInput = document.querySelector(`#panel-${taskId} .panel-log-form input`);
    logInput.value = pending.originalText + '. Additional context: ' + answer;
    input.value = '';
    document.getElementById('clarify-' + taskId).classList.remove('visible');
    analyzeLog(taskId, logInput);
  }

  async function executeLog(taskId) {
    const pending = pendingPlans[taskId];
    if (!pending) return;

    let planEl = document.getElementById('plan-' + taskId);

    // Mark task as busy (neon green highlight)
    busyTaskIds.add(taskId);
    document.getElementById('card-' + taskId)?.classList.add('agent-busy');

    // Step 1: Show sending status
    if (planEl) planEl.innerHTML = '<div class="log-plan-understanding">📤 Sending search to Work IQ...</div>';

    // Step 2: After 10s, upgrade to "waiting" if still running
    const waitTimer = setTimeout(() => {
      const el = document.getElementById('plan-' + taskId);
      if (el) el.innerHTML = '<div class="log-plan-understanding">⏳ Waiting for system response... this may take up to 90 seconds</div>';
    }, 10000);

    try {
      const res = await fetch(`/api/tasks/${taskId}/log`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ text: pending.originalText, plan: pending.plan })
      });

      clearTimeout(waitTimer);

      const data = await res.json();

      // Re-acquire DOM ref (may have been rebuilt by another task's fetchTasks)
      planEl = document.getElementById('plan-' + taskId);

      if (!res.ok) {
        if (planEl) planEl.innerHTML = `<div class="log-plan-understanding">❌ ${friendlyError(data)}</div>`;
        showNotification(friendlyError(data), 'error');
        return;
      }

      // Step 3: Response received
      const commCount = data.history?.[data.history.length - 1]?.communications?.length || 0;
      if (planEl) {
        planEl.innerHTML = commCount > 0
          ? `<div class="log-plan-understanding">✅ Done — ${commCount} communication(s) found</div>`
          : '<div class="log-plan-understanding">🔍 No communications found</div>';
      }

      const logInput = document.querySelector(`#panel-${taskId} .panel-log-form input`);
      if (logInput) logInput.value = '';
      showNotification('✅ Work logged', 'success');

      // Clear pending plan BEFORE re-render so showPlanUI() won't restore it
      delete pendingPlans[taskId];

      // Re-render but keep panels open
      await fetchTasks();

      // Hide plan div after re-render (conversation is now shown in renderConversations)
      const freshPlanEl = document.getElementById('plan-' + taskId);
      if (freshPlanEl) {
        freshPlanEl.classList.remove('visible');
        freshPlanEl.innerHTML = '';
      }

    } catch (err) {
      clearTimeout(waitTimer);
      const freshPlanEl = document.getElementById('plan-' + taskId);
      if (freshPlanEl) freshPlanEl.innerHTML = `<div class="log-plan-understanding">❌ Search failed: ${escHtml(err.message)}</div>`;
      showNotification('Failed to log work: ' + err.message, 'error');
    } finally {
      delete pendingPlans[taskId]; // safe to call even if already deleted above
      busyTaskIds.delete(taskId);
      document.getElementById('card-' + taskId)?.classList.remove('agent-busy');
    }
  }

  function cancelPlan(taskId) {
    document.getElementById('plan-' + taskId).classList.remove('visible');
    document.getElementById('clarify-' + taskId).classList.remove('visible');
    delete pendingPlans[taskId];
  }

  function showPlanUI(taskId, plan, fallback) {
    const planEl = document.getElementById('plan-' + taskId);
    if (!planEl) return;
    const kwText = plan.keywords.length > 0 ? plan.keywords.join(', ') : '(none)';
    const twFrom = plan.timeWindow?.from || '?';
    const twTo = plan.timeWindow?.to || 'now';
    planEl.innerHTML = `
      <div class="log-plan-understanding">💡 ${plan.understanding}</div>
      <div class="log-plan-details">
        <span><strong>Keywords:</strong> ${kwText}</span>
        <span><strong>Time:</strong> ${twFrom} → ${twTo}</span>
        <span><strong>Target:</strong> ${plan.searchTargets || 'all'}</span>
        ${fallback ? '<span style="color:#f59e0b">(auto-generated — AI analysis unavailable)</span>' : ''}
      </div>
      <div class="log-plan-actions">
        <button class="btn btn-primary btn-sm" onclick="executeLog('${taskId}')">✅ Search</button>
        <button class="btn btn-ghost btn-sm" onclick="cancelPlan('${taskId}')">❌ Cancel</button>
      </div>`;
    planEl.classList.add('visible');
  }

  async function deleteHistoryEntry(taskId, historyIndex) {
    if (!confirm('Delete this entry and all associated data?')) return;

    try {
      const res = await fetch(`/api/tasks/${taskId}/history/${historyIndex}`, {
        method: 'DELETE'
      });
      const data = await res.json();
      if (!res.ok) {
        showNotification(data.error || 'Failed to delete', 'error');
        return;
      }
      showNotification('Entry deleted', 'success');
      await fetchTasks();
    } catch (err) {
      showNotification('Delete failed: ' + err.message, 'error');
    }
  }

  // --- Filter ---

  function setFilter(filter, btn) {
    currentFilter = filter;
    document.querySelectorAll('.filter-bar .btn-ghost').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    renderTasks();
  }

  // --- Helpers ---

  function updateLastScan(ts) {
    const el = document.getElementById('lastScan');
    el.textContent = ts ? `Last scan: ${formatDate(ts)}` : 'Never scanned';
  }

  function formatDate(iso) {
    const d = new Date(iso);
    return d.toLocaleDateString('de-CH', { day: '2-digit', month: '2-digit', year: 'numeric' }) +
      ' ' + d.toLocaleTimeString('de-CH', { hour: '2-digit', minute: '2-digit' });
  }

  function escHtml(str) {
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }

  // --- Init ---
  checkServerHealth();
</script>

</body>
</html>
